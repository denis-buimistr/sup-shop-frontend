server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # фото товаров до 5 МБ, а Nginx по умолчанию пускает тело запроса только до 1 МБ
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # всё, что начинается с /api/, пересылаю бэкенду. backend — имя контейнера в общей сети Docker
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # у файлов из assets в имени хеш (index-a1b2c3.js), их можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: на любой путь (/ru/catalog/sup) отдаю index.html, дальше страницу выбирает React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}